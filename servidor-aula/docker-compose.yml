# servidor-aula/docker-compose.yml — servidor de IA local del centro
# Se levanta UNA vez en el servidor del aula (no en los puestos).
# En la sesión 9, los alumnos repetirán este despliegue desde cero: este
# archivo es, literalmente, el material del laboratorio de sistemas.
#
#   docker compose up -d
#   docker exec -it ollama ollama pull llama3:8b
#   docker exec -it ollama ollama pull qwen2.5:7b
#   docker exec -it ollama ollama list        # verificar modelos
#
# Los alumnos entran en  http://IP-del-servidor:8080  (el primer usuario
# registrado es administrador: debe crearlo el docente).

services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # ¿El servidor tiene GPU NVIDIA? Descomenta este bloque y verifica después
    # con:  docker exec ollama nvidia-smi
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - webui_data:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_models:
  webui_data:
